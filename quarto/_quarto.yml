project:
  type: website
  output-dir: _site

website:
  title: "Statewide Economics"
  navbar:
    background: "#0c213a"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Analysis
      - href: https://public.tableau.com/views/dashboard_final_17895298449870/Overview?:showVizHome=no
        text: Tableau Dashboard
    right:
      - href: https://github.com/buterabuilds/statewide-economics
        icon: github
        aria-label: GitHub
  page-footer:
    left: "© 2026 Matthew Butera"
    right: "Built with Quarto"

format:
  html:
    theme: [cosmo, styles.scss]
    include-in-header:
      - includes/mobile-viewport.html
    toc: true
    toc-location: left
    toc-title: "On this page"
    smooth-scroll: true
    code-fold: true
    code-summary: "Show code"
    code-tools: true
    anchor-sections: true

execute:
  freeze: auto
  echo: false
  warning: false
  message: false
